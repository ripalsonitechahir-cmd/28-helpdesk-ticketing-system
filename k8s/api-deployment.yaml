# SQLite is a single-writer file, so the API runs as ONE replica (Recreate avoids two pods
# touching the file during a rollout). The stateless web tier is what scales (see web-deployment.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: helpdesk-ticketing-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: api
          image: helpdesk-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef: { name: helpdesk-config }
            - secretRef: { name: helpdesk-secret }
          volumeMounts:
            - { name: db, mountPath: /data }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: db
          persistentVolumeClaim: { claimName: helpdesk-db }
